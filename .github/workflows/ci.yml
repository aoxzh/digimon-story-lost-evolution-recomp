name: ci

# Tooling checks only. The game build needs the player's own ROM and is never
# run in CI.
on:
  push:
  pull_request:

jobs:
  tooling:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python tooling
        run: python -m compileall -q tools tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke
        run: |
          python tools/lostevo.py --help
          python tools/lostevo.py status --json
