name: release

# Publishes the source/tooling archive. It contains no game data: the game is
# built on the player's machine from their own ROM.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Package sources
        run: python tools/package_release.py --out "dist/lostevo-recomp-$(cat VERSION)-sources.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: sources
          path: dist/*
      - name: Publish draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Digimon Story: Lost Evolution Recomp $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE_NOTES.md --draft
