name: release

# Builds the player download. It contains no game data, so it can be built on
# a public runner: the game itself is built later, on the player's PC, from
# the player's own ROM.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-kit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Fetch and patch the pinned framework sources
        run: python tools/lostevo.py bootstrap
      - name: Check the framework patches really applied
        shell: bash
        run: |
          grep -q 'g_card_rom.assign(capacity, 0)' ndsrecomp/runner/src/io.cpp
          test -f ndsrecomp/runner/tests/cart_rom_test.cpp
          grep -q -- '--freebios' ndsrecomp/runner/src/android_main.cpp
          grep -q 'NDS_FRONTEND_SHOT_DIR' ndsrecomp/runner/src/frontend.cpp
      - name: Package
        shell: bash
        run: |
          version="$(cat VERSION)"
          python tools/package_release.py --windows-kit \
            --out "dist/DigimonLostEvolutionRecomp-${version}-windows-x64.zip"
          python tools/package_release.py \
            --out "dist/DigimonLostEvolutionRecomp-${version}-sources.zip"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/*
          if-no-files-found: error
      - name: Publish draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Digimon Story: Lost Evolution Recomp $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE_NOTES.md --draft
